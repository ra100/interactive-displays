# docker compose up -d  →  open http://<this-machine>:3010/d on every display, /operator on a phone,
# /builder on a laptop. Optional settings go in a .env file next to this one (see README).
services:
  displays:
    image: ghcr.io/ra100/interactive-displays:latest
    build: .
    ports:
      - "3010:3010"
    volumes:
      - displays-data:/data
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      EDITOR_TOKEN: ${EDITOR_TOKEN:-}  # protects /operator, /builder and every change; displays never need it
      PUBLIC_URL: ${PUBLIC_URL:-}      # e.g. http://192.168.1.20:3010, for QR codes
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # optional: turns on Fill with AI in the editor
      AI_MODEL: ${AI_MODEL:-}

volumes:
  displays-data:
