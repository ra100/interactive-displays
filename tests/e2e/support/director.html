<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive Displays showcase</title>
<style>
@font-face { font-family: "Antonio"; font-weight: 700; src: url("/assets/__ANTONIO700__") format("woff2"); }
@font-face { font-family: "Antonio"; font-weight: 400; src: url("/assets/__ANTONIO400__") format("woff2"); }
@font-face { font-family: "Rajdhani"; font-weight: 600; src: url("/assets/__RAJDHANI600__") format("woff2"); }
@font-face { font-family: "Rajdhani"; font-weight: 400; src: url("/assets/__RAJDHANI400__") format("woff2"); }
:root { --accent: #ff9c00; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
/* Fixed, so a page that scrolls something into view (focus does) stops at its own frame: the picture never moves. */
iframe { position: fixed; border: 0; background: #000; }
/* The camera moves and scales the app from its top left corner, so a move is one transform: no jump between shots. */
#main, #next { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transition: transform 1.6s cubic-bezier(.65,0,.35,1); }
/* The next page loads out of sight while the current one plays, so a cut only has to swap them. */
#next { visibility: hidden; }
#pip {
  right: 48px; bottom: 48px; width: 768px; height: 432px; opacity: 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,.45), 0 24px 80px rgba(0,0,0,.9);
  transition: opacity .5s ease;
}
#pip.on { opacity: 1; }
#pip-tag {
  position: absolute; right: 48px; bottom: 488px; padding: 6px 14px; opacity: 0;
  background: var(--accent); color: #000; font: 600 20px/1 "Rajdhani"; letter-spacing: .2em;
  transition: opacity .5s ease;
}
#pip-tag.on { opacity: 1; }
/* Near opaque, so the app's own text never shows through a caption. */
#caption {
  position: fixed; left: 56px; bottom: 56px; max-width: 1040px; padding: 12px 30px 16px 24px;
  background: rgba(0,0,0,.96); border-left: 8px solid var(--accent); color: #fff;
  opacity: 0; transform: translateY(18px); transition: opacity .45s ease, transform .45s ease;
  will-change: opacity, transform;
}
#caption.on { opacity: 1; transform: none; }
#caption.right { left: auto; right: 56px; bottom: auto; top: 96px; max-width: 900px; }
#caption.corner { left: auto; right: 56px; }
#kicker { font: 600 21px/1 "Rajdhani"; letter-spacing: .26em; color: var(--accent); text-transform: uppercase; }
#title { margin-top: 10px; font: 700 54px/1.05 "Antonio"; letter-spacing: .03em; text-transform: uppercase; }
#subtitle { margin-top: 8px; font: 400 27px/1.3 "Rajdhani"; color: #dde3ec; }
#subtitle:empty { display: none; }
#card {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; background: radial-gradient(ellipse at center, rgba(20,24,40,.9), #000 70%); opacity: 0;
  transition: opacity .8s ease;
}
#card.on { opacity: 1; }
#card h1 { margin: 0; font: 700 150px/1 "Antonio"; letter-spacing: .07em; color: #ff9c00; text-transform: uppercase; }
#card p { margin: 0; max-width: 1400px; text-align: center; font: 400 38px/1.35 "Rajdhani"; color: #e8ecf2; }
#card .bars { display: flex; gap: 12px; }
#card .bars span { display: block; height: 22px; border-radius: 11px; }
/* Over everything, rings included. */
#fade { position: fixed; inset: 0; z-index: 1; background: #000; opacity: 1; transition: opacity .35s ease-in-out; will-change: opacity; }
/* Three displays side by side: the one pressed large on the left, the two it reaches on the right. */
.split { opacity: 0; transition: opacity .5s ease; }
.split.on { opacity: 1; }
iframe.split { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
#split-bg { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #10131f, #000 75%); }
#s1 { left: 32px; top: 76px; width: 1216px; height: 684px; }
#s2 { left: 1280px; top: 76px; width: 608px; height: 342px; }
#s3 { left: 1280px; top: 486px; width: 608px; height: 342px; }
.tag {
  position: absolute; padding: 6px 14px; background: var(--accent); color: #000;
  font: 600 20px/1 "Rajdhani"; letter-spacing: .2em; text-transform: uppercase;
}
#t1 { left: 32px; top: 40px; }
#t2 { left: 1280px; top: 40px; }
#t3 { left: 1280px; top: 450px; }
#caption.split-place { left: 32px; bottom: auto; top: 800px; max-width: 1150px; }
#stopwatch { position: absolute; left: 1280px; top: 868px; color: #fff; }
#stopwatch small { display: block; font: 600 21px/1 "Rajdhani"; letter-spacing: .26em; color: var(--accent); }
#stopwatch b { display: block; margin-top: 8px; font: 700 96px/1 "Antonio"; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
/* Where a control is touched. */
.tap {
  position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
  border: 5px solid #fff; box-shadow: 0 0 24px rgba(255,255,255,.8);
  animation: tap 1.1s ease-out forwards;
}
.tap.remote { border-color: var(--accent); box-shadow: 0 0 24px var(--accent); }
iframe.split.changed { animation: changed 1.2s ease-out; }
@keyframes changed { from { box-shadow: 0 0 0 8px var(--accent), 0 0 60px var(--accent); } to { box-shadow: 0 0 0 2px rgba(255,255,255,.35); } }
@keyframes tap { from { transform: scale(.4); opacity: 1; } to { transform: scale(3); opacity: 0; } }
#pip, #pip-tag, #caption, #card, #fade, .split, .tap { pointer-events: none; }
iframe.split.on { pointer-events: auto; }
</style>
</head>
<body>
<iframe id="main" title="App"></iframe>
<iframe id="next" title="Next"></iframe>
<iframe id="pip" title="Display"></iframe>
<div id="pip-tag">DISPLAY · LIVE</div>
<div id="split-bg" class="split"></div>
<iframe id="s1" class="split" title="Display 1"></iframe>
<iframe id="s2" class="split" title="Display 2"></iframe>
<iframe id="s3" class="split" title="Display 3"></iframe>
<div id="t1" class="tag split"></div>
<div id="t2" class="tag split"></div>
<div id="t3" class="tag split"></div>
<div id="stopwatch" class="split"><small>Since the press</small><b></b></div>
<div id="caption"><div id="kicker"></div><div id="title"></div><div id="subtitle"></div></div>
<div id="card">
  <div class="bars">
    <span style="width:220px;background:#ff9c00"></span><span style="width:90px;background:#cc99cc"></span>
    <span style="width:160px;background:#9999ff"></span><span style="width:60px;background:#ffcc99"></span>
  </div>
  <h1 id="card-title"></h1>
  <p id="card-text"></p>
  <div class="bars">
    <span style="width:60px;background:#ffcc99"></span><span style="width:160px;background:#9999ff"></span>
    <span style="width:90px;background:#cc99cc"></span><span style="width:220px;background:#ff9c00"></span>
  </div>
</div>
<div id="fade"></div>
<script>
const $ = (id) => document.getElementById(id);
const WIDTH = 1920;
const HEIGHT = 1080;
// Closer than this and the app's text turns soft.
const MAX_ZOOM = 2.4;
const clamp = (value, low, high) => Math.min(Math.max(value, low), high);
// Where the camera points: the app moved by x, y and scaled from its top left corner.
let view = { x: 0, y: 0, scale: 1 };
// The shot that frames a box of the app (in the app's own pixels) in an area of the picture, as close as it fits,
// never past the app's edges. No box: the whole app, fitted into the area when there is one (above a caption, say).
const shot = (box, area, margin = 40) => {
  if (!box && !area) return { x: 0, y: 0, scale: 1 };
  if (!box) {
    const scale = Math.min(area.width / WIDTH, area.height / HEIGHT, 1);
    return { x: area.x + (area.width - scale * WIDTH) / 2, y: area.y + (area.height - scale * HEIGHT) / 2, scale };
  }
  area ??= { x: 0, y: 0, width: WIDTH, height: HEIGHT };
  const scale = clamp(Math.min((area.width - 2 * margin) / box.width, (area.height - 2 * margin) / box.height), 1, MAX_ZOOM);
  const x = area.x + area.width / 2 - scale * (box.x + box.width / 2);
  const y = area.y + area.height / 2 - scale * (box.y + box.height / 2);
  return { x: clamp(x, WIDTH - scale * WIDTH, 0), y: clamp(y, HEIGHT - scale * HEIGHT, 0), scale };
};
const aim = (frame, next, seconds) => {
  view = next;
  frame.style.transitionDuration = `${seconds}s`;
  frame.style.transform = next.scale === 1 ? "" : `translate(${next.x}px, ${next.y}px) scale(${next.scale})`;
};
const nextFrame = (change) => new Promise((resolve) => requestAnimationFrame(() => { change(); resolve(); }));
const load = (frame, src) => new Promise((resolve) => {
  frame.addEventListener("load", () => resolve(), { once: true });
  frame.src = src;
});
window.director = {
  go: (src) => load($("main"), src),
  prepare: (src) => load($("next"), src),
  // The next page takes the picture, seen whole.
  swap: () => {
    const shown = $("main");
    const waiting = $("next");
    shown.id = "next";
    waiting.id = "main";
    aim(shown, shot(null), 0);
    aim(waiting, shot(null), 0);
    shown.src = "about:blank";
  },
  preloadPip: (src) => ($("pip").getAttribute("src") === src ? Promise.resolve() : load($("pip"), src)),
  pip: async (src) => {
    if (!src) {
      $("pip").classList.remove("on"); $("pip-tag").classList.remove("on");
      setTimeout(() => { $("pip").src = "about:blank"; }, 600);
      return;
    }
    if ($("pip").getAttribute("src") !== src) await load($("pip"), src);
    $("pip").classList.add("on"); $("pip-tag").classList.add("on");
  },
  // Frames a box of the app in an area of the picture (the whole picture when left out) over `seconds`; no box
  // shows the whole app, in the area or the whole picture. Resolves with the scale once the move has ended.
  camera: (box, area, seconds = 1.6) => {
    aim($("main"), shot(box ?? null, area ?? undefined), seconds);
    return new Promise((resolve) => setTimeout(() => resolve(view.scale), seconds * 1000));
  },
  // Rings a box of the app where it is in the picture now, wherever the camera points.
  tapApp: (box) => window.director.tap(view.x + view.scale * (box.x + box.width / 2), view.y + view.scale * (box.y + box.height / 2)),
  // Changes start with a frame, so a busy page cannot eat their first steps.
  fade: (on) => nextFrame(() => { $("fade").style.opacity = on ? "1" : "0"; }),
  // The caption goes and the picture fades to black together.
  dip: () => nextFrame(() => { $("caption").classList.remove("on"); $("fade").style.opacity = "1"; }),
  accent: (colour) => document.documentElement.style.setProperty("--accent", colour),
  // A caption replacing one on screen goes first and comes back with the new text, unless `instant` (when the
  // picture changes at the same moment). Resolves once the new caption is up.
  caption: async (kicker, title, subtitle = "", place = "", instant = false) => {
    const box = $("caption");
    if (box.classList.contains("on") && !instant) {
      box.classList.remove("on");
      await new Promise((resolve) => setTimeout(resolve, 450));
    }
    $("kicker").textContent = kicker; $("title").textContent = title; $("subtitle").textContent = subtitle;
    box.classList.toggle("right", place === "right");
    box.classList.toggle("corner", place === "corner");
    box.classList.toggle("split-place", place === "split");
    box.classList.add("on");
  },
  // Load three displays (with their tags) out of sight; split(true) shows them over the main frame.
  preloadSplit: (displays) => Promise.all(displays.map(([src, tag], index) => {
    $(`t${index + 1}`).textContent = tag;
    return $(`s${index + 1}`).getAttribute("src") === src ? Promise.resolve() : load($(`s${index + 1}`), src);
  })),
  split: (on) => {
    document.querySelectorAll(".split").forEach((element) => element.classList.toggle("on", on));
    if (!on) setTimeout(() => document.querySelectorAll("iframe.split").forEach((frame) => { frame.src = "about:blank"; }), 600);
  },
  tap: (x, y, remote = false) => {
    const ring = document.createElement("div");
    ring.className = remote ? "tap remote" : "tap";
    ring.style.left = `${x}px`; ring.style.top = `${y}px`;
    document.body.append(ring);
    setTimeout(() => ring.remove(), 1200);
  },
  // Counts up from the press; stop() holds the time, reset("") clears it.
  stopwatch: (() => {
    let started = 0;
    let running = false;
    const tick = () => {
      $("stopwatch").querySelector("b").textContent = `T + ${((performance.now() - started) / 1000).toFixed(1)} s`;
      if (running) requestAnimationFrame(tick);
    };
    return (command) => {
      if (command === "start") { started = performance.now(); running = true; tick(); }
      else if (command === "stop") running = false;
      else { running = false; $("stopwatch").querySelector("b").textContent = command; }
    };
  })(),
  // Watches the beat play out: starts the stopwatch when the first display's control flashes (it was pressed), rings
  // the second display's control when it flashes (used from the first), and stops the stopwatch and outlines the
  // third display once its screen has changed (it shows a Back button).
  watchBeat: () => {
    const ringed = new Set();
    let pressed = false;
    const watch = () => {
      if (!pressed && $("s1").contentDocument?.querySelector("[data-flash='true']")) {
        pressed = true;
        window.director.stopwatch("start");
      }
      const frame = $("s2");
      frame.contentDocument?.querySelectorAll("[data-flash='true']").forEach((control) => {
        if (ringed.has(control)) return;
        ringed.add(control);
        const box = control.getBoundingClientRect();
        const outer = frame.getBoundingClientRect();
        window.director.tap(outer.left + box.left + box.width / 2, outer.top + box.top + box.height / 2, true);
      });
      const moved = [...($("s3").contentDocument?.querySelectorAll("button") ?? [])].some((button) => /back/i.test(button.textContent ?? ""));
      if (!moved) { requestAnimationFrame(watch); return; }
      window.director.stopwatch("stop");
      $("s3").classList.add("changed");
      setTimeout(() => $("s3").classList.remove("changed"), 1300);
    };
    requestAnimationFrame(watch);
  },
  hide: () => $("caption").classList.remove("on"),
  card: (title, text) => {
    if (!title) { $("card").classList.remove("on"); return; }
    $("card-title").textContent = title; $("card-text").textContent = text; $("card").classList.add("on");
  },
};
</script>
</body>
</html>
