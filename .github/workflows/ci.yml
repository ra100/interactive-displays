name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: interactive-displays:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (start, serve, restart with data kept)
        run: |
          wait_healthy() {
            for _ in $(seq 1 30); do curl -fs localhost:3010/health && return 0; sleep 1; done
            docker logs displays; return 1
          }
          docker run -d --name displays -p 3010:3010 interactive-displays:ci
          wait_healthy
          curl -fs localhost:3010/d/test | grep -q '<div id="root">'
          docker restart displays
          wait_healthy
          test "$(docker logs displays 2>&1 | grep -c 'Seeded data directory')" = "1"
